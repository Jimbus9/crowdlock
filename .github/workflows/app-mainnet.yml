# Builds the REAL-bitcoin (mainnet) Crowdlock app for Android and publishes it
# as the "app-mainnet" release. Run by hand only (Actions -> App (real bitcoin)
# -> Run workflow): nothing builds it by itself. It installs beside the test
# app under its own package name, so the two never share a wallet.
#
# The APK is signed with the app's own key, held by the founder and kept in this
# repository's Actions secrets ANDROID_SIGNING_KEY (the .p12 file as base64) and
# ANDROID_SIGNING_PASSWORD, made with app/scripts/make-signing-key.sh. A phone
# only accepts an update signed with the same key, so nobody else can make an
# "update" of this app. Without both secrets the build stops: it never falls
# back to Expo's public development key, which signed it until 17 November 2026.

name: App (real bitcoin)

on:
  workflow_dispatch:

permissions:
  contents: write   # to publish the release with the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the app's libraries
        working-directory: app
        run: npm ci

      - name: Install the lock tools' libraries
        # The app's tests check its signatures against bitcoinjs-message and
        # its locks against method/lock/lock.mjs, both installed here.
        working-directory: method/lock
        run: npm ci

      - name: Test the key module on a private chain
        working-directory: app/test-chain
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Generate the Android project
        working-directory: app
        env:
          EXPO_PUBLIC_NETWORK: mainnet
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: app/android
        env:
          EXPO_PUBLIC_NETWORK: mainnet
        # services.gradle.org sometimes times out; try the whole step again.
        run: |
          for try in 1 2 3 4 5 6; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "Attempt $try failed; waiting before trying again"
            sleep $((try * 30))
          done
          exit 1

      - name: Sign it with the app's own key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::The signing key isn't in this repository's secrets (ANDROID_SIGNING_KEY, ANDROID_SIGNING_PASSWORD). Not publishing an app signed with a public key."
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          key="$RUNNER_TEMP/crowdlock-release.p12"
          printf '%s' "$SIGNING_KEY" | base64 -d > "$key"
          # apksigner replaces the development signature the build put on it.
          "$tools/apksigner" sign --ks "$key" --ks-type PKCS12 --ks-pass env:SIGNING_PASSWORD \
            --ks-key-alias crowdlock --out crowdlock-mainnet.apk \
            app/android/app/build/outputs/apk/release/app-release.apk
          rm -f "$key"
          "$tools/apksigner" verify --verbose --print-certs crowdlock-mainnet.apk | tee signed.txt
          grep -q "Number of signers: 1" signed.txt
          grep -q "certificate DN: CN=Crowdlock" signed.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signed.txt
          fingerprint="$(grep -m1 'certificate SHA-256 digest' signed.txt | awk '{print $NF}')"
          echo "FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "Signed. Certificate SHA-256: $fingerprint"

      - name: Publish it as the app-mainnet release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-mainnet --yes --cleanup-tag || true
          gh release create app-mainnet crowdlock-mainnet.apk \
            --title "Crowdlock app — REAL BITCOIN build" \
            --notes "Real bitcoin (mainnet). Early build, not independently reviewed. Built from ${GITHUB_SHA::7}. Signed with the app's own key, certificate SHA-256 ${FINGERPRINT}. Install on Android by opening this file on the phone." \
            --prerelease
