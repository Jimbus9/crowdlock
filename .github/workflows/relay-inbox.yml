# The relay inbox: every two minutes, collect registrations and locks posted to
# the Nostr relays a Crowdlock names, add the valid ones to its register, and
# republish the site. Uses no secrets: only the permission GitHub gives every
# repository's own jobs to write to that repository.
#
# Run it by hand from the Actions tab ("Run workflow"); tick "selftest" to first
# post a registration for a brand-new test member, and watch it arrive.

name: Relay inbox

on:
  # A backstop only. GitHub runs schedules late or not at all (one run in three
  # hours, the first night), so each run keeps the inbox going itself — see
  # the last step — and this restarts the chain within the hour if it breaks.
  # An odd minute, away from the top of the hour when GitHub is busiest.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Post a registration for a new test member first"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  actions: write   # only to start the next run of this same job

# Never two runs at once: each reads the register, then writes it. A run that
# arrives while one is going waits its turn.
concurrency:
  group: relay-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the relay library
        working-directory: method/relay
        # Without the libraries' own install scripts: this job's token can write to the
        # repository, and none of them needs one (security loop, 17 November 2026).
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Self-test — post a new test member's registration
        if: ${{ inputs.selftest }}
        working-directory: method/relay
        run: node selftest.mjs kop-fund-testnet4 && sleep 20

      # About fifty minutes of checking the relays every two minutes. Each pass
      # takes the latest register first (the endpoints write to it too), adds
      # whatever is new and valid, commits, and asks for the site to be
      # republished.
      - name: Collect records from the relays, every two minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Crowdlock relay inbox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A sign of life anyone can read without GitHub's API: one small file,
          # alive.json, alone on its own branch (inbox-alive), replaced about
          # every ten minutes. It never touches main's history, starts no other
          # job, and if writing it fails the pass carries on regardless.
          last_ok=$(git fetch -q --depth 1 origin inbox-alive 2>/dev/null && git show FETCH_HEAD:alive.json 2>/dev/null | sed -n 's/.*"last_ok":"\([^"]*\)".*/\1/p') || last_ok=""
          heartbeat() {
            blob=$(printf '{"last_pass":"%s","last_ok":"%s","run":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$last_ok" "$GITHUB_RUN_ID" | git hash-object -w --stdin) &&
            tree=$(printf '100644 blob %s\talive.json\n' "$blob" | git mktree) &&
            commit=$(git commit-tree "$tree" -m "Inbox alive") &&
            git push -qf origin "$commit:refs/heads/inbox-alive"
          }
          broken=""
          for pass in $(seq 1 24); do
            git pull --rebase -q || true
            if (cd method/relay && node inbox.mjs); then
              last_ok=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            else
              echo "This pass failed; trying again next pass."
            fi
            if [ $((pass % 5)) -eq 1 ]; then heartbeat || echo "Could not write the sign of life."; fi
            if [ -n "$(git status --porcelain -- crowdlocks registrations.json method/relay/health.json method/relay/announced.json)" ]; then
              for f in crowdlocks registrations.json method/relay/health.json method/relay/announced.json; do
                if [ -e "$f" ]; then git add "$f"; fi
              done
              git commit -q -m "$(cat method/relay/.message 2>/dev/null || echo 'Records via relays')"
              pushed=no
              for i in 1 2 3; do
                if git pull --rebase -q && git push -q; then pushed=yes; break; fi
                sleep 5
              done
              if [ "$pushed" = yes ]; then
                gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || echo "Could not request a site rebuild."
              fi
            fi
            rm -f method/relay/.message
            if [ -f method/relay/.broken ]; then broken="$(cat method/relay/.broken)"; rm -f method/relay/.broken; fi
            if [ "$pass" -lt 24 ]; then sleep 110; fi
          done
          # A Crowdlock whose file doesn't check out was skipped on every pass. Fail
          # the run so it shows red (the next run still starts), instead of only
          # saying so in this log. Fix: run relay/check.mjs and correct the file.
          if [ -n "$broken" ]; then
            while IFS= read -r line; do [ -n "$line" ] && echo "::error::Nothing was collected for $line"; done <<< "$broken"
            exit 1
          fi

      # Start the next run, so the inbox never depends on GitHub's schedule.
      # GitHub lets a job's own token start a run this way and no other way.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/relay-inbox.yml/dispatches" -f ref="${{ github.ref_name }}" -F 'inputs[selftest]=false'
