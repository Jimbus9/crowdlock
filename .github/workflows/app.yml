# Builds the Crowdlock app for Android whenever the app changes, and publishes
# the installable file (APK) as the "app-test" release, where it can be
# downloaded straight onto a phone.
#
# It runs the key module's chain test first. A build whose wallet code fails
# its test is never published.
#
# The APK is signed with Expo's standard development key. That is fine for
# testing on our own phones with test money, and it is NOT how a real release
# will be signed — that comes at milestone 7, with its own key.

name: App

on:
  push:
    branches: [main]
    # The inbox code too: the app carries a copy of it for founders' new
    # Crowdlocks, and the build fails if that copy has fallen out of date.
    # (method/relay/health.json is left out — the inbox writes it daily.)
    paths: ["app/**", ".github/workflows/app.yml", "method/js/*.mjs", "method/js/vendor/**", "method/relay/*.mjs", "method/relay/package*.json"]
  workflow_dispatch:

# Two jobs, as in the real-bitcoin build, so that code from npm and Gradle
# never runs holding a token that can write to this repository:
#
#   build    installs the libraries, tests, builds the APK. Its token can
#            only read, and is not left on disk for the libraries to find.
#   publish  runs no code from the repository or from any library. It takes
#            the APK the build handed on and publishes it as "app-test".
#
# Two jobs, so that no library the build installs ever holds a token that
# could write: with one, it could publish an app of its own as a release, or
# change this repository's code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the app's libraries
        working-directory: app
        run: npm ci

      - name: Install the lock tools' libraries
        # The app's tests check its signatures against bitcoinjs-message and
        # its locks against method/lock/lock.mjs, both installed here.
        working-directory: method/lock
        run: npm ci

      - name: Test the key module on a private chain
        working-directory: app/test-chain
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Generate the Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: app/android
        # services.gradle.org sometimes times out; try the whole step again.
        run: |
          for try in 1 2 3 4 5 6; do
            ./gradlew assembleRelease --no-daemon && exit 0
            echo "Attempt $try failed; waiting before trying again"
            sleep $((try * 30))
          done
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the release with the APK
    steps:
      # No checkout, no libraries: nothing here but the file the build made.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-apk

      # A new release for every build, as for the real-bitcoin app (see
      # app-mainnet.yml): with immutable releases on, a published app can't be
      # changed, so each build gets its own tag, made as a draft and published
      # once its file is attached. The two newest test builds are kept. The
      # link people use is https://crowdlock.org/get/test/ (written below).
      - name: Publish it as a new test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app-release.apk crowdlock-test.apk
          tag="app-test-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$tag" crowdlock-test.apk \
            --target "$GITHUB_SHA" \
            --draft --prerelease --latest=false \
            --title "Crowdlock app — test build, $(date -u '+%-d %B %Y')" \
            --notes "Test money only (testnet4). Built from ${GITHUB_SHA::7}. Install on Android by opening this file on the phone."
          gh release edit "$tag" --draft=false --latest=false
          echo "Published $tag: https://github.com/${GH_REPO}/releases/download/$tag/crowdlock-test.apk"

          # crowdlock.org/get/test/ starts the download of the newest build.
          # The tag changes with every build, so the website's "Download
          # Crowdlock Test" button points at that page, and this rewrites it.
          url="https://github.com/${GH_REPO}/releases/download/$tag/crowdlock-test.apk"
          cat > page.html <<PAGE
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Download Crowdlock Test</title>
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=$url">
          <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
          <link rel="stylesheet" href="../../style.css">
          </head>
          <body>
          <main class="wrap">
            <section class="hero">
              <h1>Downloading Crowdlock Test</h1>
              <p class="lede">The test app for Android. It uses test bitcoin, which is free and worth nothing.</p>
              <p>If the download hasn't started, <a href="$url">download it here</a>. Open the file on your phone to install it.</p>
              <p class="soft small">This page is rewritten each time the test app is built.</p>
            </section>
          </main>
          </body>
          </html>
          PAGE
          sha=$(gh api "repos/${GH_REPO}/contents/get/test/index.html" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/${GH_REPO}/contents/get/test/index.html" \
            -f message="Test app download link: $tag" \
            -f content="$(base64 -w0 page.html)" \
            ${sha:+-f sha="$sha"}

          # Older test builds go, keeping the one before this as well, so the
          # download page still works in the few minutes before the website
          # picks up its new version. (An immutable release can still be
          # deleted; its tag is never reused.)
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^app-test(-|$)' | sort -r | tail -n +3 | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag || true
          done
